name: Clean failed PyPI deployments

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm removal of failed deployment records in the pypi environment"
        required: true
        type: boolean
        default: false

permissions:
  deployments: write

jobs:
  cleanup:
    name: Remove failed PyPI deployment records
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove deployments whose latest status is failure
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const environment = "pypi";

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, environment, per_page: 100 }
            );

            core.info(`Found ${deployments.length} deployment(s) in environment "${environment}".`);

            const failed = [];
            for (const deployment of deployments) {
              const statuses = await github.paginate(
                github.rest.repos.listDeploymentStatuses,
                { owner, repo, deployment_id: deployment.id, per_page: 100 }
              );

              if (statuses.length === 0) {
                core.info(`Skipping deployment ${deployment.id}: no status is available.`);
                continue;
              }

              const latest = statuses.reduce((newest, status) =>
                Date.parse(status.created_at) > Date.parse(newest.created_at) ? status : newest
              );

              if (latest.state === "failure") {
                failed.push({ deployment, latest });
              }
            }

            core.info(`Found ${failed.length} deployment(s) whose latest status is failure.`);

            const removed = [];
            for (const { deployment } of failed) {
              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: "inactive",
                description: "Marked inactive before removing this failed deployment record.",
                auto_inactive: false
              });

              await github.rest.repos.deleteDeployment({
                owner,
                repo,
                deployment_id: deployment.id
              });

              removed.push({
                id: deployment.id,
                description: deployment.description || "(no description)",
                sha: deployment.sha
              });
              core.info(`Removed failed deployment ${deployment.id}.`);
            }

            core.summary
              .addHeading("PyPI deployment cleanup")
              .addRaw(`Checked ${deployments.length} deployment(s) in the pypi environment. Removed ${removed.length} failed deployment(s). Successful deployments and the pypi environment were left untouched.`);

            if (removed.length > 0) {
              core.summary.addTable([
                [{ data: "Deployment ID", header: true }, { data: "Description", header: true }, { data: "Commit", header: true }],
                ...removed.map(item => [String(item.id), item.description, item.sha.slice(0, 7)])
              ]);
            }

            await core.summary.write();
