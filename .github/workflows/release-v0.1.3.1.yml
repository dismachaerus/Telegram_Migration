name: Create v0.1.3.1 release and publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Create release v0.1.3.1 and publish that version to PyPI"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  release-and-publish:
    name: Create GitHub release and start PyPI publishing
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    steps:
      - name: Create release and dispatch the existing PyPI publisher
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = "0.1.3.1";
            const tag = "v" + version;
            const targetCommit = "0f3d6802d4409ded2316e4fee06213adc5dfe5ac";

            // Guard against releasing a commit with the wrong package version.
            const versionFile = await github.rest.repos.getContent({
              owner, repo,
              path: "telegram_migration/_version.py",
              ref: targetCommit
            });
            const source = Buffer.from(versionFile.data.content, "base64").toString("utf8");
            const match = source.match(/^__version__\s*=\s*["']([^"']+)["']/m);
            if (!match || match[1] !== version) {
              throw new Error(`Expected package version ${version} at ${targetCommit}; found ${match?.[1] ?? "unknown"}.`);
            }

            // Ensure an existing tag, if any, points to the exact intended source commit.
            let tagExists = false;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              tagExists = true;
              let targetSha = ref.data.object.sha;
              if (ref.data.object.type === "tag") {
                const annotated = await github.rest.git.getTag({ owner, repo, tag_sha: targetSha });
                targetSha = annotated.data.object.sha;
              }
              if (targetSha !== targetCommit) {
                throw new Error(`Tag ${tag} already exists at ${targetSha}, not the intended commit ${targetCommit}. No release was changed.`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            // Create the release if it does not already exist.
            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = existing.data;
              core.info(`Release ${tag} already exists; reusing it.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              const notes = await github.rest.repos.generateReleaseNotes({
                owner, repo,
                tag_name: tag,
                target_commitish: targetCommit,
                previous_tag_name: "v0.1.3"
              });
              const created = await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tag,
                target_commitish: targetCommit,
                name: tag,
                body: notes.data.body,
                draft: false,
                prerelease: false,
                make_latest: "true"
              });
              release = created.data;
              core.info(`Created release ${tag}.`);
            }

            // workflow_dispatch is allowed to start a new workflow with GITHUB_TOKEN.
            // Avoid queuing another publish if this exact tag already succeeded or is running.
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: "publish.yml", event: "workflow_dispatch", per_page: 100 }
            );
            const tagRuns = runs.filter(run => run.head_branch === tag);
            const alreadySucceeded = tagRuns.some(run => run.conclusion === "success");
            const alreadyRunning = tagRuns.some(run =>
              ["queued", "in_progress", "requested", "waiting", "pending"].includes(run.status)
            );

            let publishState;
            if (alreadySucceeded) {
              publishState = "A successful PyPI publish run for this tag already exists; no duplicate run was started.";
            } else if (alreadyRunning) {
              publishState = "A PyPI publish run for this tag is already queued or running.";
            } else {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo,
                workflow_id: "publish.yml",
                ref: tag
              });
              publishState = `Dispatched the existing PyPI publishing workflow for ${tag}.`;
            }

            await core.summary
              .addHeading(`Release ${tag}`)
              .addRaw(`GitHub release: ${release.html_url}\n\n${publishState}`)
              .addRaw("\n\nThe release tag points to the verified source commit containing package version 0.1.3.1.")
              .write();
