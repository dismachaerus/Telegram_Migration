name: Clean failed PyPI deployment records

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Remove failed deployment records from the pypi environment only"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

jobs:
  clean:
    name: Remove failed PyPI deployment records
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove failed PyPI deployment records
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const environment = "pypi";

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, environment, per_page: 100 }
            );

            const failed = [];
            for (const deployment of deployments) {
              const statuses = await github.paginate(
                github.rest.repos.listDeploymentStatuses,
                { owner, repo, deployment_id: deployment.id, per_page: 100 }
              );

              if (statuses.length === 0) continue;

              const latest = statuses.reduce((newest, status) =>
                Date.parse(status.created_at) > Date.parse(newest.created_at) ? status : newest
              );

              if (latest.state === "failure") failed.push(deployment);
            }

            const removed = [];
            for (const deployment of failed) {
              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: "inactive",
                description: "Marked inactive before removing this failed PyPI deployment record.",
                auto_inactive: false
              });

              await github.rest.repos.deleteDeployment({
                owner,
                repo,
                deployment_id: deployment.id
              });

              removed.push(deployment.id);
            }

            await core.summary
              .addHeading("Failed PyPI deployment cleanup")
              .addRaw(`Removed ${removed.length} failed deployment record(s). The pypi environment and published package files were not changed.`)
              .addRaw(removed.length ? `\n\nRemoved deployment IDs: ${removed.join(", ")}` : "")
              .write();
